# Overnight CPU run. 128x128, small batch - see HANDOFF.md for the exact
# command and how to check progress. `train.steps` is calibrated from an
# actual measured per-step cost on this machine (~1.87s/step at batch_size
# 4, 128x128, via src.experiments.train_pcim.run() timed over 59 real
# non-smoke steps using the logged elapsed_s column - not a guess, but also
# not universal: if you're on noticeably faster/slower hardware, re-time a
# short run and scale `train.steps` accordingly.
seed: 0

data:
  categories: [carpet, bottle, screw]
  size: 128
  n_train_per_category: 64

anomaly:
  kinds: [texture, scratch, blob]

degrade:
  families: [defocus, motion, illumination, noise, jpeg, mixed]
  severity_range: [1, 5]

model:
  n_iters: 5
  rho0: 1.0
  rho_scale: 2.0
  prox_width: 24
  prox_depth: 4
  illum_clamp: 4.0
  vst_gain: 1.0

loss:
  use_lpres: true
  # Each term's raw magnitude is measured on the first real training batch
  # and scaled to a common baseline before these weights are applied - see
  # train_pcim.py's module docstring. Without this, L_freq's raw magnitude
  # (1-2 orders of magnitude above the other three) would dominate
  # regardless of w_freq.
  normalize: true
  w_rec: 1.0
  w_deg: 0.5
  w_freq: 0.1
  w_pres: 1.0

train:
  lr: 0.0002
  batch_size: 4
  steps: 15000
  log_every: 50
  checkpoint_every: 150
  eval_every: 375

eval:
  seed: 12345
  n_examples: 24
